name: Diagnose DJD HTTPS
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-https.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read GitHub domain health
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{html_url,cname,status,https_enforced,https_certificate,protected_domain_state,pending_domain_unverified_at}'
          gh api "repos/$GITHUB_REPOSITORY/pages/health"
      - name: Read public DNS answers
        run: |
          python - <<'PY'
          import urllib.request,json
          for name,kind in [("djd.rip","A"),("djd.rip","AAAA"),("djd.rip","CAA"),("www.djd.rip","CNAME")]:
              with urllib.request.urlopen("https://dns.google/resolve?name="+name+"&type="+kind,timeout=20) as res:
                  data=json.load(res)
                  print(name,kind,json.dumps(data.get("Answer",[])))
          PY
